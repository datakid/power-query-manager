name: ci
on:
  push:
    branches: [fable]
  pull_request:
    branches: [fable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:lint
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: |
          set +e
          npm run test:unit 2>&1 | tee unit.log
          code=${PIPESTATUS[0]}
          sh scripts/ci-annotate.sh "unit totals" unit.log -E '^# (tests|pass|fail|skipped)'
          sh scripts/ci-annotate.sh "unit failures" unit.log -E '^ *not ok|^ *error:|^ *expected:|^ *actual:|^ *location:'
          exit $code
      - name: Install browser
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: ${{ !cancelled() }}
        run: |
          set +e
          npm run test:browser 2>&1 | tee browser.log
          code=${PIPESTATUS[0]}
          sh scripts/ci-annotate.sh "browser totals" browser.log -E '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)'
          grep -E '^ +✘' browser.log | grep -v 'visual.spec' > browser-nonvisual.log
          sh scripts/ci-annotate.sh "browser failures except visual" browser-nonvisual.log -E '.'
          grep -E '^ +✘.*visual.spec' browser.log | sort -u | wc -l > browser-visual.log
          sh scripts/ci-annotate.sh "browser visual failure count" browser-visual.log -E '.'
          awk '/^ +[0-9]+\) \[chromium\]/ {p = ($0 !~ /visual.spec/); n=0} p && n<16 {print; n++}' browser.log > browser-details.log
          sh scripts/ci-annotate.sh "browser failure details" browser-details.log -E '.'
          exit $code
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
