name: ci
on:
  push:
    branches: [fable]
  pull_request:
    branches: [fable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          set +e
          npm run test:browser 2>&1 | tee browser.log
          code=${PIPESTATUS[0]}
          summary=$(grep -E '✘|[0-9]+ (passed|failed|flaky|skipped)|Error:|Expected|Received|Screenshot|pixels' browser.log | head -150 | cut -c1-240 | awk '{printf "%s%%0A", $0}')
          echo "::notice title=browser summary::$summary"
          exit $code
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
