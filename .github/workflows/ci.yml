name: ci
on:
  push:
    branches: [fable]
  pull_request:
    branches: [fable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          set +e
          npm run test:browser 2>&1 | tee browser.log
          code=${PIPESTATUS[0]}
          enc() { head -c 3500 | awk '{printf "%s%%0A", $0}'; }
          grep -E '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)' browser.log | enc | { read -r x; echo "::notice title=browser totals::$x"; }
          grep -E '^ +✘' browser.log | grep -v 'visual.spec' | cut -c1-220 | enc | { read -r x; echo "::notice title=browser failures except visual::$x"; }
          grep -cE '^ +✘.*visual.spec' browser.log | { read -r n; echo "::notice title=browser visual failures::$n"; }
          awk '/^ +[0-9]+\) \[chromium\]/ {p = ($0 !~ /visual.spec/); n=0} p && n<16 {print; n++}' browser.log | cut -c1-200 | enc | { read -r x; echo "::notice title=browser failure details::$x"; }
          exit $code
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
